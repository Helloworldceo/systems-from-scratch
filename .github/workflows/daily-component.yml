name: daily component

on:
  schedule:
    - cron: "7 1 * * *"   # every day 01:07 UTC (09:07 Beijing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-component
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Generate next component
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/generate_component.py
      - name: Run full test suite
        if: steps.gen.outputs.message != ''
        run: pytest
      - name: Commit to main
        if: steps.gen.outputs.message != ''
        run: |
          git config user.name "Dawit Abdisa"
          git config user.email "105408779+Helloworldceo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.gen.outputs.message }}"
          git push
